<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Análisis de pagos 2026</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.59.0/build/stlite.css" />
</head>
<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.59.0/build/stlite.js"></script>
  <script>
    stlite.mount(
      {
        requirements: ["pandas", "plotly"],
        entrypoint: "app.py",
        files: {
          "app.py": {
            url: "app.py",
          },
          "data/datos_dinamica.csv": {
            url: "data/datos_dinamica.csv",
          }
        }
      },
      document.getElementById("root")
    );
  </script>
</body>
</html>
