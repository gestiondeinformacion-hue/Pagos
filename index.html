<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Datos</title>
    <!-- Importar SheetJS para leer Excel desde el cliente -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <!-- Importar Chart.js para graficar -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .chart-container {
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>Dashboard - Datos Dinámicos</h1>
    <p>Visualización de datos desde <code>data/datos_dinamica.xlsx</code></p>
    
    <div class="chart-container">
        <canvas id="miGrafico"></canvas>
    </div>

    <script>
        async function cargarDatosYGraficar() {
            try {
                // 1. Obtener el archivo Excel usando la ruta de tu repositorio
                const response = await fetch('./data/datos_dinamica.xlsx');
                if (!response.ok) {
                    throw new Error('No se pudo cargar el archivo Excel.');
                }
                const arrayBuffer = await response.arrayBuffer();

                // 2. Leer el archivo con SheetJS
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                
                // 3. Tomar la primera hoja del Excel
                const primeraHojaName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[primeraHojaName];

                // 4. Convertir los datos de la hoja a formato JSON
                const datosJson = XLSX.utils.sheet_to_json(worksheet);

                if (datosJson.length === 0) {
                    alert("El archivo Excel está vacío o no se pudo leer correctamente.");
                    return;
                }

                // 5. Preparar los datos para Chart.js
                // El script asume automáticamente que la PRIMERA columna son las etiquetas (Eje X) 
                // y la SEGUNDA columna son los valores (Eje Y).
                const llaves = Object.keys(datosJson[0]);
                const columnaEtiquetas = llaves[0]; 
                const columnaValores = llaves[1];

                const etiquetas = datosJson.map(fila => fila[columnaEtiquetas]);
                const valores = datosJson.map(fila => fila[columnaValores]);

                // 6. Crear el gráfico con Chart.js
                const ctx = document.getElementById('miGrafico').getContext('2d');
                new Chart(ctx, {
                    type: 'bar', // Puedes cambiar esto a 'line', 'pie', 'doughnut', etc.
                    data: {
                        labels: etiquetas,
                        datasets: [{
                            label: columnaValores,
                            data: valores,
                            backgroundColor: 'rgba(54, 162, 235, 0.6)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            } catch (error) {
                console.error("Error al procesar el archivo Excel:", error);
                document.querySelector('.chart-container').innerHTML = 
                    `<p style="color: red;">Error al cargar los datos. Asegúrate de que el archivo <b>./data/datos_dinamica.xlsx</b> exista y se encuentre en esa ruta.</p>`;
            }
        }

        // Ejecutar la función en cuanto cargue la página
        window.onload = cargarDatosYGraficar;
    </script>
</body>
</html>
